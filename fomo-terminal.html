<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/><meta name="theme-color" content="#fbbf24"/>
<link rel="manifest" href="./manifest.json"/>
<title>FOMO Terminal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#e8e8e8;font-family:system-ui,sans-serif;min-height:100dvh;padding:12px}
.w{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{font-size:20px;font-family:monospace} .b{font-size:10px;color:#6b6b6b;border:1px solid #333;padding:2px 6px;border-radius:99px;margin-left:6px}
.card{background:#0c0c0c;border:1px solid #1a1a1a;border-radius:12px;padding:14px}
.lbl{font-size:10px;color:#6b6b6b;text-transform:uppercase}
.sol{font-size:28px;font-family:monospace;font-weight:700}
.pnl{font-size:12px;font-family:monospace;margin-top:6px;color:#22c55e}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{background:#0c0c0c;border:1px solid #1a1a1a;border-radius:10px;padding:8px;text-align:center}
.sv{font-family:monospace;font-size:16px;font-weight:700}.sl{font-size:9px;color:#6b6b6b}
.log{background:#0c0c0c;border:1px solid #1a1a1a;border-radius:12px;padding:10px;height:140px;overflow-y:auto;font-family:monospace;font-size:10px;line-height:1.5}
.hist{background:#0c0c0c;border:1px solid #1a1a1a;border-radius:12px;padding:10px;max-height:140px;overflow-y:auto;font-family:monospace;font-size:10px;display:none}
.hist.on{display:block}
.btn{flex:1;background:#111;border:1px solid #2a2a2a;color:#e8e8e8;font-family:monospace;font-size:11px;padding:12px;border-radius:9px}
.row{display:flex;gap:6px}
.g{color:#22c55e}.r{color:#ef4444}.y{color:#eab308}.a{color:#fbbf24}.m{color:#6b6b6b}
</style></head><body><div class="w">
<div><h1>FOMO <span class="b">paper · v3</span></h1><div class="m" style="font-size:10px;font-family:monospace">persistent paper trading</div></div>
<div class="card"><div class="lbl">Balance (saved on device)</div><div class="sol"><span id="bal">5.00</span> SOL</div><div class="pnl" id="pnl">+0.00 SOL</div></div>
<div class="stats">
<div class="st"><div class="sv" style="color:#3b82f6" id="sS">0</div><div class="sl">seen</div></div>
<div class="st"><div class="sv g" id="sB">0</div><div class="sl">bought</div></div>
<div class="st"><div class="sv y" id="sK">0</div><div class="sl">skipped</div></div>
<div class="st"><div class="sv r" id="sR">0</div><div class="sl">rugs</div></div>
</div>
<div class="log" id="log"></div>
<div class="hist" id="hist"></div>
<div class="row">
<button class="btn" id="run" onclick="tog()">● RUN</button>
<button class="btn" onclick="showH()">HISTORY</button>
<button class="btn" onclick="exp()">CSV</button>
<button class="btn" onclick="rst()">RESET</button>
</div>
<div class="m" style="text-align:center;font-size:9px;font-family:monospace">Rules: dev>10% skip · bundle>25% skip · rug wallet skip · dev sell exit · graduate sell</div>
</div>
<script>
const SK='fomo_terminal_v3',SB=5,BS=0.32;
let bal=SB,pos=[],logT=[],seen=0,bought=0,skipped=0,rugs=0,run=true,rugsW=new Set();
function ok(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}}
const can=ok();
function save(){if(!can)return;try{localStorage.setItem(SK,JSON.stringify({bal,pos,logT,seen,bought,skipped,rugs,rugsW:[...rugsW],t:Date.now()}))}catch(e){}}
function load(){if(!can)return false;try{const r=localStorage.getItem(SK);if(!r)return false;const d=JSON.parse(r);if(typeof d.bal!=='number')return false;bal=d.bal;pos=d.pos||[];logT=d.logT||[];seen=d.seen||0;bought=d.bought||0;skipped=d.skipped||0;rugs=d.rugs||0;rugsW=new Set(d.rugsW||[]);return true}catch(e){return false}}
function log(m,c){const e=document.createElement('div');e.innerHTML='<span class="m">grok></span> <span class="'+c+'">'+m+'</span>';document.getElementById('log').prepend(e)}
function ui(){document.getElementById('bal').textContent=bal.toFixed(2);const p=bal-SB;document.getElementById('pnl').textContent=(p>=0?'+':'')+p.toFixed(2)+' SOL';document.getElementById('pnl').style.color=p>=0?'#22c55e':'#ef4444';document.getElementById('sS').textContent=seen;document.getElementById('sB').textContent=bought;document.getElementById('sK').textContent=skipped;document.getElementById('sR').textContent=rugs}
function rec(type,sym,sol,note,ca){logT.push({ts:new Date().toISOString(),type,sym,sol,note,ca:ca||''});if(logT.length>200)logT=logT.slice(-200);save()}
function tick(){if(!run)return;seen++;const dev=2+Math.random()*22,bundle=Math.random()*40,sym='$MEME'+(0|Math.random()*999);if(dev>10){skipped++;if(Math.random()<.3){rugs++;log('skip '+sym+' · dev holds '+dev.toFixed(0)+'%','r')}return}if(bundle>25){skipped++;log('skip '+sym+' · bundles '+bundle.toFixed(0)+'%','y');return}if(Math.random()<.25&&pos.length<4&&bal>=BS+.05){bal-=BS;pos.push({sym,size:BS,entry:BS});bought++;rec('BUY',sym,BS,'entry','');log(sym+' → buy '+BS.toFixed(2)+' SOL','g');ui();save()}if(pos.length&&Math.random()<.15){const p=pos.pop();const m=.5+Math.random()*2.5;const got=p.size*m;bal+=got;rec('SELL',p.sym,got,'exit','');log('sold '+p.sym+' '+((m-1)*100).toFixed(0)+'%','a');ui();save()}}
function tog(){run=!run;document.getElementById('run').textContent=run?'● RUN':'○ PAUSE';log(run?'resumed':'paused','m')}
function showH(){const h=document.getElementById('hist');h.classList.toggle('on');h.innerHTML=logT.slice().reverse().slice(0,40).map(t=>'<div>'+t.ts.slice(11,19)+' '+t.type+' '+t.sym+' '+t.sol+(t.ca?' <span style="color:#60a5fa;text-decoration:underline" onclick="navigator.clipboard.writeText(\''+t.ca+'\')">'+t.ca.slice(0,4)+'…</span>':'')+'</div>').join('')||'<div class="m">No trades</div>'}
function exp(){if(!logT.length){log('no trades','m');return}const csv='time,type,sym,ca,sol\n'+logT.map(t=>t.ts+','+t.type+','+t.sym+','+(t.ca||'')+','+t.sol).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='fomo.csv';a.click()}
function rst(){if(!confirm('Reset paper to 5 SOL?'))return;bal=SB;pos=[];logT=[];seen=bought=skipped=rugs=0;rugsW.clear();try{localStorage.removeItem(SK)}catch(e){}ui();log('reset 5.00 SOL','m')}
const rest=load();ui();
if(rest)log('restored '+bal.toFixed(2)+' SOL · '+logT.length+' trades','g');
else log('FOMO v3 · paper persists on device','m');
if(!can)log('storage blocked — will reset on reload','r');
setInterval(tick,1200);setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
</script></body></html>
